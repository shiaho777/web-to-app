<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; color: var(--wta-on-surface, #1f2937); }
.wta-tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px}
.wta-tool-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px;border-radius:10px;border:none;background:var(--wta-surface-dim,#f9fafb);cursor:pointer;color:var(--wta-on-surface,#374151);transition:all .2s}
.wta-tool-btn:active{background:var(--wta-accent-soft,rgba(99,102,241,.1))}
.wta-tool-icon{font-size:24px}
.wta-tool-label{font-size:13px;font-weight:500}
  #wta-toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #111827; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #wta-toast.show { opacity: .95; }
</style>
<script type="hcj/page">

(function() {
    'use strict';

    const LANG = (hcj.lang || 'zh').toLowerCase().startsWith('ar') ? 'ar' :
                 (hcj.lang || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    const I18N = {
        zh: { name: '内容增强', enableCopy: '解除复制限制', copyText: '复制页面文本', copyHtml: '复制页面HTML', toTop: '回到顶部', toBottom: '滚动到底部', copyEnabled: '已解除复制限制', textCopied: '页面文本已复制', htmlCopied: '页面HTML已复制', copyFailed: '复制失败', atTop: '已回到顶部', atBottom: '已到达底部' },
        en: { name: 'Content Enhance', enableCopy: 'Enable Copy', copyText: 'Copy Page Text', copyHtml: 'Copy Page HTML', toTop: 'To Top', toBottom: 'To Bottom', copyEnabled: 'Copy restriction removed', textCopied: 'Page text copied', htmlCopied: 'Page HTML copied', copyFailed: 'Copy failed', atTop: 'At top', atBottom: 'At bottom' },
        ar: { name: 'تحسين المحتوى', enableCopy: 'تفعيل النسخ', copyText: 'نسخ نص الصفحة', copyHtml: 'نسخ HTML', toTop: 'إلى الأعلى', toBottom: 'إلى الأسفل', copyEnabled: 'تم إزالة قيود النسخ', textCopied: 'تم نسخ النص', htmlCopied: 'تم نسخ HTML', copyFailed: 'فشل النسخ', atTop: 'في الأعلى', atBottom: 'في الأسفل' }
    };
    const T = I18N[LANG] || I18N.en;

    // Feedback goes to the page toast AND the panel toast — whichever is visible.
    function toast(m) { hcj.toast(m); hcj.panel.send({ type: 'toast', msg: String(m) }); }

    var copyEnabledDone = false;
    function enableCopy() {
        if (copyEnabledDone) { toast(T.copyEnabled); return; }
        copyEnabledDone = true;
        if (document.body) {
            document.body.style.userSelect = 'auto';
            document.body.style.webkitUserSelect = 'auto';
        }
        ['copy', 'cut', 'paste', 'selectstart', 'contextmenu'].forEach(function(e) {
            document.addEventListener(e, function(ev) { ev.stopPropagation(); }, true);
        });
        document.oncopy = document.oncut = document.onpaste = document.onselectstart = document.oncontextmenu = null;
        const style = document.createElement('style');
        style.textContent = '*{user-select:auto!important;-webkit-user-select:auto!important}';
        (document.head || document.documentElement).appendChild(style);
        hcj.toast(T.copyEnabled);
    }

    function copyText(text, okMsg) {
        function done(ok) { toast(ok ? okMsg : T.copyFailed); }
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { done(true); }, function() { legacyCopy(text, done); });
            } else {
                legacyCopy(text, done);
            }
        } catch (e) { legacyCopy(text, done); }
    }

    function legacyCopy(text, done) {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
            document.body.appendChild(ta);
            ta.select();
            done(!!document.execCommand('copy'));
            document.body.removeChild(ta);
        } catch (e) { done(false); }
    }

    function copyPageText() { copyText(document.body ? document.body.innerText : '', T.textCopied); }
    function copyPageHtml() { copyText(document.documentElement.outerHTML, T.htmlCopied); }

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); toast(T.atTop); }
    function scrollToBottom() {
        window.scrollTo({ top: Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0), behavior: 'smooth' });
        toast(T.atBottom);
    }

    function updatePanelUI() {
        hcj.panel.send({ type: 'state', labels: { enableCopy: T.enableCopy, copyText: T.copyText, copyHtml: T.copyHtml, toTop: T.toTop, toBottom: T.toBottom } });
    }

    var ACT = {
        enableCopy: enableCopy,
        copyText: copyPageText,
        copyHtml: copyPageHtml,
        toTop: scrollToTop,
        toBottom: scrollToBottom
    };

    
    hcj.panel.onMessage(function (m) {
        if (!m) return;
        if (m.cmd === 'refresh') { updatePanelUI(); return; }
        if (m.cmd === 'act' && ACT[m.action]) ACT[m.action](m.arg || '');
    });
    hcj.on('action', function () { hcj.panel.open(); });
})();
</script>
</head>
<body>
<div id="root"><div class="wta-mod-panel">
<div class="wta-tool-grid">
<button class="wta-tool-btn" data-ce-action="enableCopy"><span class="wta-tool-icon"><svg style="display:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg></span><span class="wta-tool-label" id="wta-tool-copy"></span></button>
<button class="wta-tool-btn" data-ce-action="copyText"><span class="wta-tool-icon"><svg style="display:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4z"/></svg></span><span class="wta-tool-label" id="wta-tool-text"></span></button>
<button class="wta-tool-btn" data-ce-action="copyHtml"><span class="wta-tool-icon"><svg style="display:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span><span class="wta-tool-label" id="wta-tool-html"></span></button>
<button class="wta-tool-btn" data-ce-action="toTop"><span class="wta-tool-icon"><svg style="display:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M6 13l6-6 6 6"/><path d="M4 3h16"/></svg></span><span class="wta-tool-label" id="wta-tool-top"></span></button>
<button class="wta-tool-btn" data-ce-action="toBottom"><span class="wta-tool-icon"><svg style="display:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg></span><span class="wta-tool-label" id="wta-tool-bottom"></span></button>
</div>
</div></div>
<div id="wta-toast"></div>
<script>
  var root = document.getElementById('root');
  var toastEl = document.getElementById('wta-toast');
  var toastTimer = null;

  function showToast(m) {
    toastEl.textContent = m;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  hcjPanel.onMessage(function (m) {
    if (!m) return;
    if (m.type === 'toast') showToast(m.msg || '');
    else if (m.type === 'state' && typeof render === 'function') render(m);
  });

  function render(m) {
    var ids = ['wta-tool-copy', 'wta-tool-text', 'wta-tool-html', 'wta-tool-top', 'wta-tool-bottom'];
    var keys = ['enableCopy', 'copyText', 'copyHtml', 'toTop', 'toBottom'];
    ids.forEach(function (id, i) { var el = document.getElementById(id); if (el && m.labels && m.labels[keys[i]]) el.textContent = m.labels[keys[i]]; });
  }
  root.querySelectorAll('[data-ce-action]').forEach(function (el) {
    el.addEventListener('click', function () {
      hcjPanel.send({ cmd: 'act', action: el.getAttribute('data-ce-action') });
    });
  });
  hcjPanel.send({ cmd: 'refresh' });
</script>
</body>
</html>
