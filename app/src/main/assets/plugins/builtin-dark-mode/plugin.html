<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; padding: 8px 16px 16px; color: var(--wta-on-surface, #1f2937); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; }
  .row-text { flex: 1; min-width: 0; }
  .status { font-size: 15px; font-weight: 500; }
  .desc { font-size: 12px; color: var(--wta-on-surface-variant, #9ca3af); margin-top: 2px; }
  .switch { position: relative; width: 46px; height: 28px; flex-shrink: 0; border: none; background: none; cursor: pointer; padding: 0; }
  .switch .track { position: absolute; inset: 0; border-radius: 14px; background: var(--wta-outline, #d1d5db); transition: background .2s; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
  .switch[data-state="on"] .track { background: var(--wta-accent, #6366f1); }
  .switch[data-state="on"] .thumb { left: 21px; }
</style>
<script type="hcj/page">
(function () {
  'use strict';

  var rawLang = (hcj.lang || 'zh').toLowerCase();
  var LANG = rawLang.indexOf('ar') === 0 ? 'ar' : (rawLang.indexOf('zh') === 0 ? 'zh' : 'en');
  var T = ({
    zh: { on: '深色模式已开启', off: '深色模式已关闭', desc: '智能反色，保护眼睛', turnOn: '开启深色模式', turnOff: '关闭深色模式' },
    en: { on: 'Dark Mode On', off: 'Dark Mode Off', desc: 'Smart inversion, protect your eyes', turnOn: 'Turn On Dark Mode', turnOff: 'Turn Off Dark Mode' },
    ar: { on: 'الوضع الداكن مفعل', off: 'الوضع الداكن موقف', desc: 'عكس ذكي، حماية العين', turnOn: 'تفعيل الوضع الداكن', turnOff: 'إيقاف الوضع الداكن' }
  })[LANG] || {};

  var enabled = hcj.config.get('enabled', false);
  var styleEl = null;

  var darkCSS = 'html,html body{filter:invert(1) hue-rotate(180deg)!important;-webkit-filter:invert(1) hue-rotate(180deg)!important;background:#111!important}' +
    'img,video,picture,canvas,svg,iframe,[style*="background-image"],embed,object{filter:invert(1) hue-rotate(180deg)!important;-webkit-filter:invert(1) hue-rotate(180deg)!important}';

  function styleParent() {
    return document.head || document.documentElement;
  }

  function apply() {
    if (enabled) {
      if (!styleEl || !styleEl.parentNode) {
        styleEl = document.createElement('style');
        styleEl.id = 'wta-dark-mode';
        var parent = styleParent();
        if (parent) {
          parent.appendChild(styleEl);
        } else {
          var obs = new MutationObserver(function (m, o) {
            var p = styleParent();
            if (p) { p.appendChild(styleEl); styleEl.textContent = darkCSS; o.disconnect(); }
          });
          var target = document.documentElement || document.body;
          if (target instanceof Node) obs.observe(target, { childList: true, subtree: true });
          return;
        }
      }
      styleEl.textContent = darkCSS;
    } else if (styleEl) {
      styleEl.textContent = '';
    }
    hcj.badge(enabled ? 'ON' : '', '#6366f1');
  }

  function pushState() {
    hcj.panel.send({ type: 'state', enabled: enabled, t: T });
  }

  function toggle() {
    enabled = !enabled;
    hcj.config.set('enabled', enabled);
    apply();
    pushState();
  }

  hcj.on('action', function () { toggle(); });
  hcj.panel.onMessage(function (m) {
    if (!m) return;
    if (m.cmd === 'toggle') toggle();
    if (m.cmd === 'getState') pushState();
  });

  apply();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { if (enabled) apply(); });
  }
})();
</script>
</head>
<body>
  <div class="row">
    <div class="row-text">
      <div class="status" id="status"></div>
      <div class="desc" id="desc"></div>
    </div>
    <button class="switch" id="btn" data-state="off" aria-label="toggle">
      <span class="track"></span><span class="thumb"></span>
    </button>
  </div>
<script>
  var statusEl = document.getElementById('status');
  var descEl = document.getElementById('desc');
  var btn = document.getElementById('btn');

  function render(s) {
    statusEl.textContent = s.enabled ? s.t.on : s.t.off;
    descEl.textContent = s.t.desc;
    btn.setAttribute('data-state', s.enabled ? 'on' : 'off');
  }

  hcjPanel.onMessage(function (m) {
    if (m && m.type === 'state') render(m);
  });
  btn.addEventListener('click', function () { hcjPanel.send({ cmd: 'toggle' }); });
  hcjPanel.send({ cmd: 'getState' });
</script>
</body>
</html>
