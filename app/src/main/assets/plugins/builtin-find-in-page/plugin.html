<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; color: var(--wta-on-surface, #1f2937); }
.wta-find-panel{display:flex;flex-direction:column;gap:12px;padding:4px}
.wta-find-bar{display:flex;align-items:center;gap:8px;background:var(--wta-surface-dim,#f8fafc);border:1px solid var(--wta-outline,#e5e7eb);border-radius:12px;padding:8px 10px}
.wta-find-icon{font-size:20px}
.wta-find-input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--wta-on-surface,#111827);font-size:15px;line-height:24px}
.wta-find-search-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--wta-on-surface-variant,#6b7280);padding:4px}
.wta-find-nav{display:flex;align-items:center;justify-content:space-between}
.wta-find-status{font-size:13px;color:var(--wta-on-surface-variant,#9ca3af)}
.wta-find-nav-btns{display:flex;gap:6px}
.wta-find-nav-btn,.wta-find-clear-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--wta-outline,#e5e7eb);background:var(--wta-surface-dim,#f3f4f6);font-size:13px;cursor:pointer;color:var(--wta-on-surface,#374151);transition:all .2s}
.wta-find-nav-btn:active,.wta-find-clear-btn:active{background:var(--wta-accent-soft,rgba(99,102,241,.1))}
  #wta-toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #111827; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #wta-toast.show { opacity: .95; }
</style>
<script type="hcj/page">

(function() {
    'use strict';

    function toast(msg) { hcj.notify((hcj.manifest && hcj.manifest.name) || 'plugin', String(msg)); }
    function pushPanel() { hcj.panel.send({ type: 'panel', html: getPanelHtml() }); }
    function pushHtml(html) { hcj.panel.send({ type: 'panel', html: html }); }


    const LANG = (hcj.lang || 'zh').toLowerCase().startsWith('ar') ? 'ar' :
                 (hcj.lang || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    const I18N = {
        zh: { name: '页内查找', placeholder: '在当前页面查找', prev: '上一个', next: '下一个', clear: '清除', noMatch: '未找到匹配项', nativeUnavailable: '当前内核不支持原生页内查找', enterKeyword: '请输入关键词', searching: '正在查找...', tip: '使用 WebView 原生查找，高亮结果并自动定位', matchCount: '{0} / {1}' },
        en: { name: 'Find in page', placeholder: 'Find in current page', prev: 'Previous', next: 'Next', clear: 'Clear', noMatch: 'No matches found', nativeUnavailable: 'Native find is unavailable in this engine', enterKeyword: 'Enter a keyword', searching: 'Searching...', tip: 'Uses native WebView search to highlight and jump between matches', matchCount: '{0} / {1}' },
        ar: { name: 'بحث في الصفحة', placeholder: 'ابحث في الصفحة الحالية', prev: 'السابق', next: 'التالي', clear: 'مسح', noMatch: 'لا توجد نتائج', nativeUnavailable: 'البحث الأصلي غير متاح في هذا المحرك', enterKeyword: 'أدخل كلمة البحث', searching: 'جاري البحث...', tip: 'يستخدم بحث WebView الأصلي لتمييز النتائج والتنقل بينها', matchCount: '{0} / {1}' }
    };
    const T = I18N[LANG] || I18N.en;

    let currentQuery = '';
    let currentState = { supported: false, activeMatchOrdinal: -1, numberOfMatches: 0, doneCounting: true, displayIndex: 0 };

    function esc(value) {
        return String(value || '').replace(/[&<>"']/g, function(ch) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
    }

    function parseState(raw) {
        if (!raw) return currentState;
        if (typeof raw === 'object') return raw;
        try { return JSON.parse(raw); } catch(e) { return currentState; }
    }

    function setState(nextState) {
        currentState = Object.assign({}, currentState, parseState(nextState));
        refreshPanel();
    }

    function callNative(name) {
        if (typeof NativeBridge === 'undefined' || typeof NativeBridge[name] !== 'function') return null;
        try {
            if (name === 'findInPage') return NativeBridge.findInPage(currentQuery);
            if (name === 'findNextInPage') return NativeBridge.findNextInPage(arguments[1] !== false);
            if (name === 'clearFindInPage') return NativeBridge.clearFindInPage();
        } catch(e) {
            console.warn('[Find in page] Native call failed:', e);
        }
        return null;
    }

    function fallbackFind(forward) {
        if (!currentQuery) return false;
        try {
            if (typeof window.find === 'function') {
                return window.find(currentQuery, false, forward === false, true, false, false, false);
            }
        } catch(e) {
            console.warn('[Find in page] window.find fallback failed:', e);
        }
        return false;
    }

    function doSearch(q) {
        if (typeof q === 'string') currentQuery = q.trim();
        if (!currentQuery) {
            toast(T.enterKeyword);
            return;
        }

        const nativeState = callNative('findInPage');
        if (nativeState) {
            setState(nativeState);
            setTimeout(function() {
                if (currentState.doneCounting && currentState.numberOfMatches === 0) {
                    toast(T.noMatch);
                }
            }, 500);
            return;
        }

        currentState = { supported: false, activeMatchOrdinal: -1, numberOfMatches: fallbackFind(true) ? 1 : 0, doneCounting: true, displayIndex: 0 };
        toast(currentState.numberOfMatches ? T.nativeUnavailable : T.noMatch);
        refreshPanel();
    }

    function go(forward, q) {
        if (!currentQuery) {
            doSearch(q);
            return;
        }
        const nativeState = callNative('findNextInPage', forward);
        if (nativeState) {
            setState(nativeState);
        } else {
            fallbackFind(forward);
        }
    }

    function clearSearch() {
        currentQuery = '';
        const nativeState = callNative('clearFindInPage');
        currentState = parseState(nativeState) || { supported: false, activeMatchOrdinal: -1, numberOfMatches: 0, doneCounting: true, displayIndex: 0 };
        refreshPanel();
    }

    function statusText() {
        if (!currentQuery) return T.tip;
        if (!currentState.doneCounting) return T.searching;
        if (!currentState.numberOfMatches) return T.noMatch;
        return T.matchCount
            .replace('{0}', currentState.displayIndex || Math.max(0, currentState.activeMatchOrdinal + 1))
            .replace('{1}', currentState.numberOfMatches);
    }

    function refreshPanel() {
        hcj.panel.send({ type: 'findstate', text: statusText(), has: currentState.numberOfMatches > 0, query: currentQuery, labels: { prev: T.prev, next: T.next, clear: T.clear, placeholder: T.placeholder } });
    }




    window.__wtaFindInPageNativeUpdate = setState;

    

    hcj.panel.onMessage(function (m) {
        if (!m) return;
        if (m.cmd === 'refresh') { refreshPanel(); return; }
        if (m.cmd === 'act') {
            if (m.action === 'findSearch') doSearch(m.arg);
            else if (m.action === 'findNext') go(true, m.arg);
            else if (m.action === 'findPrev') go(false, m.arg);
            else if (m.action === 'findClear') clearSearch();
        }
    });
    hcj.on('action', function () { hcj.panel.open(); });
})();
</script>
</head>
<body>
<div id="root"><div class="wta-mod-panel wta-find-panel">
<div class="wta-find-bar">
<span class="wta-find-icon"><svg style="display:block" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg></span>
<input id="wta-find-query" class="wta-find-input" placeholder="Find...">
<button id="wta-find-go" class="wta-find-search-btn"><svg style="display:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg></button>
</div>
<div class="wta-find-nav">
<div id="wta-find-status" class="wta-find-status"></div>
<div class="wta-find-nav-btns">
<button id="wta-find-prev" class="wta-find-nav-btn"><svg style="display:block" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg></button>
<button id="wta-find-next" class="wta-find-nav-btn"><svg style="display:block" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
<button id="wta-find-clear" class="wta-find-clear-btn"></button>
</div>
</div>
</div></div>
<div id="wta-toast"></div>
<script>
  var root = document.getElementById('root');
  var toastEl = document.getElementById('wta-toast');
  var toastTimer = null;

  function wire() {
    root.querySelectorAll('[data-wta-action]').forEach(function (el) {
      if (el.__wired) return;
      el.__wired = true;
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        hcjPanel.send({ cmd: 'act', action: el.getAttribute('data-wta-action'), arg: el.getAttribute('data-wta-arg') || '' });
      });
    });
  }

  function showToast(m) {
    toastEl.textContent = m;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  hcjPanel.onMessage(function (m) {
    if (!m) return;
    if (m.type === 'panel' && typeof m.html === 'string') { root.innerHTML = m.html; wire(); }
    else if (m.type === 'toast') showToast(m.msg || '');
    else if (m.type === 'state' && typeof render === 'function') render(m);
    else if (m.type === 'findstate' && typeof renderFind === 'function') renderFind(m);
  });

  var input = document.getElementById('wta-find-query');
  var status = document.getElementById('wta-find-status');
  var clearBtn = document.getElementById('wta-find-clear');
  function renderFind(m) {
    status.textContent = m.text || '';
    status.style.color = m.has ? '#2563eb' : '#9ca3af';
    if (m.labels) { if (m.labels.placeholder) input.placeholder = m.labels.placeholder; if (m.labels.clear) clearBtn.textContent = m.labels.clear; }
    if (m.query && !input.value) input.value = m.query;
  }
  document.getElementById('wta-find-go').addEventListener('click', function () { hcjPanel.send({ cmd: 'act', action: 'findSearch', arg: input.value }); });
  document.getElementById('wta-find-prev').addEventListener('click', function () { hcjPanel.send({ cmd: 'act', action: 'findPrev', arg: input.value }); });
  document.getElementById('wta-find-next').addEventListener('click', function () { hcjPanel.send({ cmd: 'act', action: 'findNext', arg: input.value }); });
  document.getElementById('wta-find-clear').addEventListener('click', function () { input.value = ''; hcjPanel.send({ cmd: 'act', action: 'findClear' }); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); hcjPanel.send({ cmd: 'act', action: 'findSearch', arg: input.value }); } });
  setTimeout(function () { input.focus(); }, 80);
  wire();
  hcjPanel.send({ cmd: 'refresh' });
</script>
</body>
</html>
